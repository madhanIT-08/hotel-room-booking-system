<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Customers</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar navbar-dark bg-dark px-4">
    <a class="navbar-brand" href="/">🏨 Hotel Room Booking System</a>
    <div>
        <a href="/rooms" class="btn btn-outline-light btn-sm">Rooms</a>
        <a href="/customers" class="btn btn-outline-light btn-sm">Customers</a>
        <a href="/bookings" class="btn btn-outline-light btn-sm">Bookings</a>
        <a href="/logout" class="btn btn-outline-danger btn-sm">Logout</a>
    </div>
</nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>All Customers</h2>
        <a href="/customers/new" class="btn btn-primary">+ Register Customer</a>
    </div>

    <!-- Search by name -->
    <form method="get" action="/customers" class="d-flex mb-3" style="max-width: 400px;">
        <input type="text" name="name" class="form-control me-2" placeholder="Search by name..."
               th:value="${searchTerm}">
        <button type="submit" class="btn btn-secondary">Search</button>
        <a href="/customers" class="btn btn-outline-secondary ms-2">Clear</a>
    </form>

    <table class="table table-striped table-bordered">
        <thead class="table-dark">
        <tr>
            <th>Customer ID</th>
            <th>Name</th>
            <th>Phone</th>
            <th>Email</th>
            <th>Address</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="customer : ${customers}">
            <td th:text="${customer.id}"></td>
            <td th:text="${customer.name}"></td>
            <td th:text="${customer.phone}"></td>
            <td th:text="${customer.email}"></td>
            <td th:text="${customer.address}"></td>
            <td>
                <a th:href="@{/customers/edit/{id}(id=${customer.id})}" class="btn btn-sm btn-warning">Edit</a>
                <a th:href="@{/customers/delete/{id}(id=${customer.id})}" class="btn btn-sm btn-danger"
                   onclick="return confirm('Delete this customer?');">Delete</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(customers)}">
            <td colspan="6" class="text-center text-muted">No customers found.</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
