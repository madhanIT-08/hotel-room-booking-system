<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar navbar-dark bg-dark px-4">
    <span class="navbar-brand mb-0 h1">🏨 Hotel Room Booking System</span>
    <a href="/logout" class="btn btn-outline-danger btn-sm">Logout</a>
</nav>

<div class="container text-center mt-5">
    <h1 class="mb-3" th:text="'Welcome, ' + ${customer.name} + '!'"></h1>
    <p class="text-muted mb-4">Browse rooms, book your stay, and track your reservations.</p>
    <div class="d-flex justify-content-center gap-3">
        <a href="/user/rooms" class="btn btn-primary btn-lg">Browse Available Rooms</a>
        <a href="/user/my-bookings" class="btn btn-success btn-lg">My Bookings</a>
    </div>
</div>
</body>
</html>
