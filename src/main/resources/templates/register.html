<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Guest Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container d-flex justify-content-center align-items-center" style="min-height: 90vh;">
    <div class="card p-4 shadow-sm" style="width: 420px;">
        <h3 class="text-center mb-3">🏨 Create Guest Account</h3>

        <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

        <form th:action="@{/register}" th:object="${customer}" method="post">
            <div class="mb-2">
                <label class="form-label">Full Name</label>
                <input type="text" class="form-control" th:field="*{name}" required>
            </div>
            <div class="mb-2">
                <label class="form-label">Phone Number</label>
                <input type="text" class="form-control" th:field="*{phone}" required>
            </div>
            <div class="mb-2">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" th:field="*{email}">
            </div>
            <div class="mb-2">
                <label class="form-label">Address</label>
                <textarea class="form-control" th:field="*{address}"></textarea>
            </div>
            <div class="mb-2">
                <label class="form-label">Choose a Username</label>
                <input type="text" class="form-control" th:field="*{username}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Choose a Password</label>
                <input type="password" class="form-control" th:field="*{password}" required>
            </div>
            <button type="submit" class="btn btn-success w-100">Register</button>
        </form>

        <p class="text-center mt-3 mb-0">
            Already have an account? <a href="/login">Log in</a>
        </p>
    </div>
</div>
</body>
</html>
