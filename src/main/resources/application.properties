# ===== Server =====
server.port=8080

# ===== H2 In-Memory Database =====
# No installation needed — data lives in RAM and resets every time you restart the app.
spring.datasource.url=jdbc:h2:mem:hotel_booking_db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===== H2 Web Console =====
# Lets you view/query the database in the browser at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# ===== Thymeleaf =====
spring.thymeleaf.cache=false
