<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Available Rooms</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar navbar-dark bg-dark px-4">
    <a class="navbar-brand" href="/user/dashboard">🏨 Hotel Room Booking System</a>
    <div>
        <a href="/user/rooms" class="btn btn-outline-light btn-sm">Browse Rooms</a>
        <a href="/user/my-bookings" class="btn btn-outline-light btn-sm">My Bookings</a>
        <a href="/logout" class="btn btn-outline-danger btn-sm">Logout</a>
    </div>
</nav>

<div class="container mt-4">
    <h2 class="mb-3">Available Rooms</h2>

    <div class="row g-3">
        <div class="col-md-4" th:each="room : ${rooms}">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5 class="card-title" th:text="'Room ' + ${room.roomNumber}"></h5>
                    <p class="card-text mb-1"><strong>Type:</strong> <span th:text="${room.roomType}"></span></p>
                    <p class="card-text mb-3"><strong>Price:</strong> ₹<span th:text="${room.pricePerNight}"></span> / night</p>
                    <a th:href="@{/user/book/{id}(id=${room.id})}" class="btn btn-success w-100">Book Now</a>
                </div>
            </div>
        </div>
        <p th:if="${#lists.isEmpty(rooms)}" class="text-muted">No rooms available right now — please check back later.</p>
    </div>
</div>
</body>
</html>
