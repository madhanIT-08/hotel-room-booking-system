<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Room Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar navbar-dark bg-dark px-4">
    <a class="navbar-brand" href="/">🏨 Hotel Room Booking System</a>
</nav>

<div class="container mt-4" style="max-width: 500px;">
    <h2 th:text="${room.id} != null ? 'Edit Room' : 'Add Room'"></h2>

    <form th:action="${room.id} != null ? @{/rooms/update/{id}(id=${room.id})} : @{/rooms}"
          th:object="${room}" method="post">

        <div class="mb-3">
            <label class="form-label">Room Number</label>
            <input type="text" class="form-control" th:field="*{roomNumber}">
            <div class="text-danger" th:if="${#fields.hasErrors('roomNumber')}" th:errors="*{roomNumber}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Room Type</label>
            <select class="form-select" th:field="*{roomType}">
                <option value="Single">Single</option>
                <option value="Double">Double</option>
                <option value="Deluxe">Deluxe</option>
                <option value="Suite">Suite</option>
            </select>
            <div class="text-danger" th:if="${#fields.hasErrors('roomType')}" th:errors="*{roomType}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Price Per Night (₹)</label>
            <input type="number" step="0.01" class="form-control" th:field="*{pricePerNight}">
            <div class="text-danger" th:if="${#fields.hasErrors('pricePerNight')}" th:errors="*{pricePerNight}"></div>
        </div>

        <div class="form-check mb-3">
            <input type="checkbox" class="form-check-input" th:field="*{available}">
            <label class="form-check-label">Available</label>
        </div>

        <button type="submit" class="btn btn-primary">Save</button>
        <a href="/rooms" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
