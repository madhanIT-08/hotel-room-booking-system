<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Book Room</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar navbar-dark bg-dark px-4">
    <a class="navbar-brand" href="/user/dashboard">🏨 Hotel Room Booking System</a>
</nav>

<div class="container mt-4" style="max-width: 500px;">
    <h2>Book Room <span th:text="${room.roomNumber}"></span></h2>
    <p class="text-muted">
        <span th:text="${room.roomType}"></span> — ₹<span th:text="${room.pricePerNight}"></span> / night
    </p>

    <form th:action="@{/user/book/{id}(id=${room.id})}" method="post">
        <div class="mb-3">
            <label class="form-label">Check-In Date</label>
            <input type="date" name="checkInDate" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Check-Out Date</label>
            <input type="date" name="checkOutDate" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-success">Confirm Booking</button>
        <a href="/user/rooms" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
