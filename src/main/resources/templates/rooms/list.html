<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Rooms</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar navbar-dark bg-dark px-4">
    <a class="navbar-brand" href="/">🏨 Hotel Room Booking System</a>
    <div>
        <a href="/rooms" class="btn btn-outline-light btn-sm">Rooms</a>
        <a href="/customers" class="btn btn-outline-light btn-sm">Customers</a>
        <a href="/bookings" class="btn btn-outline-light btn-sm">Bookings</a>
        <a href="/logout" class="btn btn-outline-danger btn-sm">Logout</a>
    </div>
</nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>All Rooms</h2>
        <a href="/rooms/new" class="btn btn-primary">+ Add Room</a>
    </div>

    <table class="table table-striped table-bordered">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Room Number</th>
            <th>Type</th>
            <th>Price / Night</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="room : ${rooms}">
            <td th:text="${room.id}"></td>
            <td th:text="${room.roomNumber}"></td>
            <td th:text="${room.roomType}"></td>
            <td th:text="'₹' + ${room.pricePerNight}"></td>
            <td>
                <span th:if="${room.available}" class="badge bg-success">Available</span>
                <span th:unless="${room.available}" class="badge bg-secondary">Occupied</span>
            </td>
            <td>
                <a th:href="@{/rooms/edit/{id}(id=${room.id})}" class="btn btn-sm btn-warning">Edit</a>
                <a th:href="@{/rooms/delete/{id}(id=${room.id})}" class="btn btn-sm btn-danger"
                   onclick="return confirm('Delete this room?');">Delete</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(rooms)}">
            <td colspan="6" class="text-center text-muted">No rooms added yet.</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
