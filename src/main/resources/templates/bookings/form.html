<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Booking Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar navbar-dark bg-dark px-4">
    <a class="navbar-brand" href="/">🏨 Hotel Room Booking System</a>
</nav>

<div class="container mt-4" style="max-width: 500px;">
    <h2 th:text="${booking.id} != null ? 'Edit Booking' : 'New Booking'"></h2>

    <form th:action="${booking.id} != null ? @{/bookings/update/{id}(id=${booking.id})} : @{/bookings}"
          th:object="${booking}" method="post">

        <div class="mb-3">
            <label class="form-label">Customer</label>
            <select class="form-select" th:field="*{customer}">
                <option th:each="c : ${customers}" th:value="${c.id}"
                        th:text="${c.name} + ' - ' + ${c.phone}"></option>
            </select>
            <div class="text-danger" th:if="${#fields.hasErrors('customer')}" th:errors="*{customer}"></div>
            <div class="form-text">Customer not registered yet? <a href="/customers/new">Register them here</a> first.</div>
        </div>

        <div class="mb-3">
            <label class="form-label">Room</label>
            <select class="form-select" th:field="*{room}">
                <option th:each="r : ${rooms}" th:value="${r.id}"
                        th:text="${r.roomNumber} + ' - ' + ${r.roomType} + ' (₹' + ${r.pricePerNight} + ')'"></option>
            </select>
            <div class="text-danger" th:if="${#fields.hasErrors('room')}" th:errors="*{room}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Check-In Date</label>
            <input type="date" class="form-control" th:field="*{checkInDate}">
            <div class="text-danger" th:if="${#fields.hasErrors('checkInDate')}" th:errors="*{checkInDate}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Check-Out Date</label>
            <input type="date" class="form-control" th:field="*{checkOutDate}">
            <div class="text-danger" th:if="${#fields.hasErrors('checkOutDate')}" th:errors="*{checkOutDate}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Status</label>
            <select class="form-select" th:field="*{status}">
                <option th:each="s : ${T(com.hotel.booking.entity.Booking.BookingStatus).values()}"
                        th:value="${s}" th:text="${s}"></option>
            </select>
        </div>

        <button type="submit" class="btn btn-success">Save</button>
        <a href="/bookings" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
